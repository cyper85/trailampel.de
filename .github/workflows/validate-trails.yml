name: trails.json prüfen

on:
  push:
    paths:
      - "trails.json"
      - "trails.schema.json"
      - ".github/workflows/validate-trails.yml"
  pull_request:
    paths:
      - "trails.json"
      - "trails.schema.json"
      - ".github/workflows/validate-trails.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Gegen trails.schema.json validieren
        run: >
          npx --yes -p ajv-cli@5 -p ajv-formats@3
          ajv validate
          --spec=draft2020
          -c ajv-formats
          --all-errors
          --errors=text
          -s trails.schema.json
          -d trails.json
